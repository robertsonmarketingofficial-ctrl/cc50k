<!doctype html><html><body style="margin:0;background:#9ab"><canvas id="c" style="width:100vw;height:100vh;display:block"></canvas>
<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/examples/jsm/utils/SkeletonUtils.js";
import { retarget } from "/src/game/assets.ts";
import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true }); r.setSize(innerWidth, innerHeight, false);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const s = new THREE.Scene(); s.background = new THREE.Color(0xb9c8d6);
s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
s.add(new THREE.HemisphereLight(0xdfe8f5, 0x8a6a4a, 1)); const sun = new THREE.DirectionalLight(0xfff0d8, 2.5); sun.position.set(-2, 3, 1); s.add(sun);
const cam = new THREE.PerspectiveCamera(Number(q.get("fov") || 56), innerWidth / innerHeight, 0.01, 5000);
const L = new GLTFLoader();
const animSrc = q.get("anims") ? await L.loadAsync(q.get("anims")) : null;
L.load(q.get("f"), g => {
  if (animSrc) {
    let tgt = null, src = null; g.scene.traverse(o => { if (o.isSkinnedMesh && !tgt) tgt = o; }); animSrc.scene.traverse(o => { if (o.isSkinnedMesh && !src) src = o; });
    const mode = q.get("rt") || "bake";
    const rest = animSrc.animations.find(a => a.name === "TPose");
    g.animations = animSrc.animations.map(c => mode === "utils" ? SkeletonUtils.retargetClip(tgt, src, c, { hip: "mixamorigHips" }) : retarget(g.scene, animSrc.scene, c, rest));
  }
  const root = g.scene; s.add(root);
  const box = new THREE.Box3().setFromObject(root); const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  console.log("SIZE", size.toArray().map(v => v.toFixed(3)).join(","), "CENTER", c.toArray().map(v => v.toFixed(3)).join(","));
  const info = []; root.traverse(o => { if (o.isMesh) info.push(o.name + (o.isSkinnedMesh ? "(skinned)" : "")); }); console.log("MESHES", info.join(";"));
  if (g.animations.length) { let mt = root; if (q.get("rt") === "utils") root.traverse(o => { if (o.isSkinnedMesh && mt === root) mt = o; }); const mx = new THREE.AnimationMixer(mt); const a = mx.clipAction(g.animations.find(a => a.name === (q.get("anim") || "idle")) || g.animations[0]); a.play(); mx.update(Number(q.get("t") || 0.5)); }
  const mode = q.get("view") || "fit";
  if (mode === "fit") { const d = Math.max(size.x, size.y, size.z) * 1.3; cam.position.set(c.x + d * Number(q.get("dx") ?? 1), c.y + d * 0.3, c.z + d * Number(q.get("dz") ?? 0.6)); cam.lookAt(c); }
  else { cam.position.set(0, 0, 0); cam.lookAt(0, 0, -1); const sc = Number(q.get("sc") || 0.05); root.scale.setScalar(sc); root.position.set(Number(q.get("px") || 0.04), Number(q.get("py") || -0.02), Number(q.get("pz") || 0)); root.rotation.set(THREE.MathUtils.degToRad(Number(q.get("rx") || 5)), THREE.MathUtils.degToRad(Number(q.get("ry") || 185)), 0); }
  r.render(s, cam); window.__done = true;
}, undefined, e => { console.log("ERR", e.message); window.__done = true; });
</script></body></html>
