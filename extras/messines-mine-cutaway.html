<title>Messines Mine Cutaway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#101214; --panel:rgba(20,22,25,.92); --panel-solid:#16181B; --line:#2C3035; --ink:#E9E4D8; --muted:#A09A8C; --faint:#6B675E;
  --brass:#C9A45C; --clay:#7F95A6; --flame:#E8763A;
  --display:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --ui:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);overflow:hidden}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));max-width:min(430px,calc(100% - 32px));pointer-events:none;display:grid;gap:8px}
.titlecard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.hud h1{margin:0;font:400 28px/1.05 var(--display);letter-spacing:.005em}
.hud .sub{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.clock{pointer-events:none;display:flex;gap:16px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:max-content;max-width:100%;flex-wrap:wrap}
.clock b{font:500 20px var(--mono);font-variant-numeric:tabular-nums;color:var(--brass)}
.clock span{color:var(--ink)}
.results{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;font-size:13px}
.results .row{display:flex;justify-content:space-between;gap:14px}
.results .row b{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.results .row span{color:var(--muted)}
.results .note{color:var(--muted);font-size:12.5px;margin-top:2px}
.results details{margin-top:4px;color:var(--muted);font-size:12.5px}
.results summary{cursor:pointer;color:var(--ink)}

.panel{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:12px;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.panel header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px}
.panel header h2{margin:0;font:600 12px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.panel .body{overflow:auto;padding:0 14px 14px;display:grid;gap:14px;align-content:start}
.group{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.group h3{margin:0;font:600 11.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.ctl{display:grid;gap:3px}
.ctl .top{display:flex;justify-content:space-between;gap:8px}
.ctl label{color:var(--ink)}
.ctl output{font:500 12.5px var(--mono);color:var(--brass);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--brass)}
select{width:100%;background:var(--panel-solid);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:14px var(--ui)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button,.cams button{font:600 12.5px var(--ui);color:var(--muted);background:var(--panel-solid);border:1px solid var(--line);border-radius:6px;padding:6px 4px;cursor:pointer}
.seg button[aria-pressed="true"]{color:#15120B;background:var(--brass);border-color:var(--brass)}
.cams{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cams button:hover,.seg button:hover{color:var(--ink)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.checks input{accent-color:var(--brass)}
.go{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.go button{font:600 15px var(--ui);border-radius:8px;padding:10px;cursor:pointer;border:1px solid var(--line)}
#fire{background:var(--flame);color:#1A0E06;border-color:var(--flame)}
#fire:disabled{opacity:.5;cursor:default}
#reset{background:var(--panel-solid);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hint{color:var(--faint);font-size:12.5px;margin:0}
#toggle{display:none}
.labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-100%);font:600 11.5px var(--ui);letter-spacing:.04em;color:#F3EEE2;background:rgba(14,15,17,.72);border:1px solid rgba(255,255,255,.12);padding:2px 6px;border-radius:4px;white-space:nowrap}
.lab.u{border-color:rgba(127,149,166,.55)}
.lab.hot{border-color:var(--flame);color:#FFD9C2}
.lab::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:8px;background:rgba(255,255,255,.35)}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font:15px var(--ui);pointer-events:none}
.loading[hidden]{display:none}
@media (max-width:760px){
  .panel{top:auto;left:8px;right:8px;width:auto;height:46%;bottom:8px}
  .panel.closed{height:auto}
  .panel.closed .body{display:none}
  #toggle{display:inline-block;font:600 12px var(--ui);background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 8px}
  .hud h1{font-size:23px}
  .results{display:none}
}
@media (prefers-reduced-motion: reduce){ .lab{transition:none} }
</style>

<div id="view" aria-label="3D cutaway model of a mine under Messines Ridge"></div>
<div class="labels" id="labels"></div>
<div class="loading" id="loading">Building the ridge…</div>

<div class="hud">
  <div class="titlecard">
    <h1>Messines Mine Cutaway</h1>
    <p class="sub" id="sub">Spanbroekmolen, Messines Ridge, Belgium · fired 03:10, 7 June 1917</p>
  </div>
  <div class="clock" aria-live="polite"><b id="tclock">t = 0.000 s</b><span id="stage">Ready. Press Detonate.</span></div>
  <div class="results" id="results"></div>
</div>

<aside class="panel" id="panel" aria-label="Simulation controls">
  <header><h2>Controls</h2><button type="button" id="toggle" aria-expanded="true">Hide</button></header>
  <div class="body">
    <div class="go"><button type="button" id="fire">Detonate</button><button type="button" id="reset">Reset</button></div>

    <div class="group">
      <h3>Mine</h3>
      <div class="ctl"><label for="preset">Historical mine</label>
        <select id="preset">
          <option value="spanbroekmolen">Spanbroekmolen (41 t at 27 m)</option>
          <option value="steloi">St Eloi (43 t at 38 m)</option>
          <option value="custom">Custom</option>
        </select></div>
      <div class="ctl"><div class="top"><label for="charge">Charge (ammonal)</label><output id="chargeOut"></output></div><input type="range" id="charge" min="1" max="60" step="0.1"></div>
      <div class="ctl"><div class="top"><label for="depth">Depth below surface</label><output id="depthOut"></output></div><input type="range" id="depth" min="8" max="70" step="0.5"></div>
    </div>

    <div class="group">
      <h3>Simulation</h3>
      <div class="ctl"><div class="top"><label for="speed">Speed</label><output id="speedOut"></output></div><input type="range" id="speed" min="-3" max="1" step="0.01"></div>
      <div class="ctl"><span>Accuracy / detail</span>
        <div class="seg" id="detail" role="group" aria-label="Accuracy and detail">
          <button type="button" data-v="low">Low</button><button type="button" data-v="medium">Medium</button><button type="button" data-v="high">High</button><button type="button" data-v="ultra">Ultra</button>
        </div></div>
      <div class="checks">
        <label><input type="checkbox" id="slowmo" checked> Slow-motion blast</label>
        <label><input type="checkbox" id="shake" checked> Camera shake</label>
        <label><input type="checkbox" id="dust" checked> Dust cloud</label>
        <label><input type="checkbox" id="waves" checked> Shock waves</label>
        <label><input type="checkbox" id="labelsOn" checked> Labels</label>
        <label><input type="checkbox" id="sound" checked> Sound</label>
        <label><input type="checkbox" id="glow" checked> Highlight tunnels</label>
        <label><input type="checkbox" id="night"> 03:10 darkness</label>
      </div>
    </div>

    <div class="group">
      <h3>Camera</h3>
      <div class="cams" id="cams">
        <button type="button" data-cam="section">Cutaway</button>
        <button type="button" data-cam="chamber">Charge</button>
        <button type="button" data-cam="shaft">Shaft</button>
        <button type="button" data-cam="trench">From trench</button>
        <button type="button" data-cam="overview">Overview</button>
        <button type="button" data-cam="aerial">Aerial</button>
      </div>
      <div class="ctl"><div class="top"><label for="camH">Camera height</label><output id="camHOut"></output></div><input type="range" id="camH" min="-40" max="600" step="1"></div>
      <p class="hint">Drag to orbit, right-drag or two fingers to pan, scroll or pinch to zoom.</p>
    </div>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
if (!window.THREE) { document.getElementById('loading').textContent = 'The 3D library could not load. Check your connection and reload.'; return; }
const $ = id => document.getElementById(id);
if (THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;   // treat colours as sRGB, like the canvas textures

/* ================= World layout (metres) ================= */
const XMIN = -560, XMAX = 170, ZMIN = -220, ZMAX = 0, YBOT = -62, YTOP = 22;
const XC = 8;                 // charge chamber, under the German front line
const XGF = 0, XGS = 58;      // German front and support trenches
const XBF = -92;              // British front trench
const GALLERY = 520;          // gallery length (Spanbroekmolen: about 1,717 ft)
const XS = XC - GALLERY;      // British shaft
const G = 9.81;
const PRESETS = {
  spanbroekmolen: { name: 'Spanbroekmolen', t: 41.3, d: 27, crater: 76, note: 'The real crater survives as the Pool of Peace, about 76 m across.' },
  steloi: { name: 'St Eloi', t: 43.4, d: 38, crater: null, note: 'The largest of the Messines mines.' }
};
const DETAIL = {
  low:    { cell: 4,   ejecta: 1800,  fire: 300,  dust: 700,  sub: 1, shadows: false },
  medium: { cell: 2.5, ejecta: 5000,  fire: 700,  dust: 1600,  sub: 2, shadows: false },
  high:   { cell: 1.5, ejecta: 12000, fire: 1300, dust: 3000, sub: 2, shadows: true },
  ultra:  { cell: 1,   ejecta: 26000, fire: 2400, dust: 5000, sub: 3, shadows: true }
};
const S = { preset: 'spanbroekmolen', charge: 41.3, depth: 27, speedLog: 0, detail: 'high',
  slowmo: true, shake: true, dust: true, waves: true, labels: true, sound: true, glow: true, night: false };

/* ================= Noise and terrain ================= */
function hash(i, j) { let h = (i * 374761393 + j * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function vnoise(x, z) { const i = Math.floor(x), j = Math.floor(z), fx = x - i, fz = z - j, a = hash(i, j), b = hash(i + 1, j), c = hash(i, j + 1), d = hash(i + 1, j + 1), ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz); return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz; }
function fbm(x, z, o = 4) { let s = 0, a = 1, f = 1; for (let k = 0; k < o; k++) { s += a * (vnoise(x * f + k * 17.3, z * f - k * 9.1) - .5); a *= .5; f *= 2.03; } return s; }
const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
const ridge = x => -1 + 13 * smooth(-430, 70, x);                    // Messines Ridge rises toward the German line
const clayTop = x => -6.5 + 1.2 * Math.sin(x * .011) + .6 * fbm(x / 30, 3, 2);   // top of the blue (Ieper) clay
let seedRand = 1; const rnd = () => (seedRand = (seedRand * 16807) % 2147483647) / 2147483647;

// trenches as polylines in (x,z)
function trenchLine(x0, style) {
  const pts = []; let z = 0, k = 0;
  while (z > ZMIN - 5) {
    if (style === 'german') { pts.push([x0, z], [x0, z - 7], [x0 + 3.2, z - 7], [x0 + 3.2, z - 10], [x0, z - 10]); z -= 10; }
    else { pts.push([x0 + (k % 2 ? 2.4 : 0), z], [x0 + (k % 2 ? 2.4 : 0), z - 8], [x0 + (k % 2 ? 0 : 2.4), z - 9.5]); z -= 9.5; }
    k++;
  }
  return pts;
}
function commTrench(xa, xb, z0) { const pts = []; let x = xa, k = 0; while (x < xb) { pts.push([x, z0 + (k % 2 ? 4 : -4)]); x += 7; k++; } pts.push([xb, z0]); return pts; }
const TRENCHES = [
  { pts: trenchLine(XGF, 'german'), depth: 2.3, half: 1.1, side: -1 },
  { pts: trenchLine(XGS, 'german'), depth: 2.3, half: 1.1, side: -1 },
  { pts: trenchLine(XBF, 'british'), depth: 2.0, half: 1.0, side: 1 },
  { pts: commTrench(XGF + 3, XGS, -128), depth: 2.0, half: .9, side: 0 },
  { pts: commTrench(XBF - 160, XBF, -150), depth: 1.8, half: .9, side: 0 }
];
function segDist(px, pz, ax, az, bx, bz) { const dx = bx - ax, dz = bz - az, l2 = dx * dx + dz * dz || 1; let t = ((px - ax) * dx + (pz - az) * dz) / l2; t = Math.max(0, Math.min(1, t)); const qx = ax + t * dx, qz = az + t * dz; return Math.hypot(px - qx, pz - qz); }
function trenchCarve(x, z) {
  let cut = 0;
  for (const tr of TRENCHES) {
    const p = tr.pts; let dmin = Infinity;
    for (let i = 0; i < p.length - 1; i++) {
      if (Math.abs(p[i][0] - x) > 12 && Math.abs(p[i + 1][0] - x) > 12) continue;
      if (Math.min(p[i][1], p[i + 1][1]) - 3 > z || Math.max(p[i][1], p[i + 1][1]) + 3 < z) continue;
      dmin = Math.min(dmin, segDist(x, z, p[i][0], p[i][1], p[i + 1][0], p[i + 1][1]));
    }
    if (dmin < tr.half * 1.9) cut = Math.max(cut, tr.depth * (1 - smooth(tr.half * .7, tr.half * 1.9, dmin)));
  }
  return cut;
}
// shell holes: dense in no man's land and around the lines
const HOLES = [], HOLE_CELL = 20, holeGrid = new Map();
function makeHoles() {
  seedRand = 7;
  for (let i = 0; i < 520; i++) {
    const zone = rnd();
    let x = zone < .55 ? XBF + (rnd() * 1.2 - .1) * (XGF - XBF) : zone < .85 ? XGF - 30 + rnd() * 120 : XBF - 140 + rnd() * 140;
    const z = ZMIN + 4 + rnd() * (ZMAX - ZMIN - 4);
    const r = 1.6 + Math.pow(rnd(), 2) * 5.5, d = r * (.28 + rnd() * .22);
    HOLES.push([x, z, r, d]);
  }
  for (const h of HOLES) { const k = Math.floor(h[0] / HOLE_CELL) + ',' + Math.floor(h[1] / HOLE_CELL); if (!holeGrid.has(k)) holeGrid.set(k, []); holeGrid.get(k).push(h); }
}
makeHoles();
function holesAt(x, z) {
  let s = 0; const cx = Math.floor(x / HOLE_CELL), cz = Math.floor(z / HOLE_CELL);
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const list = holeGrid.get((cx + i) + ',' + (cz + j)); if (!list) continue;
    for (const [hx, hz, r, d] of list) { const q = Math.hypot(x - hx, z - hz) / r; if (q < 1.35) s += q < 1 ? -d * (1 - q * q) + .18 * d * q ** 4 : .18 * d * Math.max(0, 1 - (q - 1) / .35); }
  }
  return s;
}
function surface0(x, z) { return ridge(x) + .9 * Math.sin(z * .018 + x * .006) + 1.3 * fbm(x / 45, z / 45) + .3 * fbm(x / 7, z / 7, 3) + holesAt(x, z) - trenchCarve(x, z); }

/* ================= Three.js scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, .3, 6000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08; controls.maxDistance = 1800; controls.minDistance = 3;
controls.screenSpacePanning = true;

// sky dome
const skyGeo = new THREE.SphereGeometry(3000, 32, 16);
const skyCol = new Float32Array(skyGeo.attributes.position.count * 3);
skyGeo.setAttribute('color', new THREE.BufferAttribute(skyCol, 3));
const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, depthWrite: false, fog: false }));
scene.add(sky);
function paintSky(night) {
  const top = new THREE.Color(night ? '#060910' : '#6F8296'), mid = new THREE.Color(night ? '#141A26' : '#B9B7A8'), low = new THREE.Color(night ? '#2A2A2C' : '#CFC3A4');
  const p = skyGeo.attributes.position, c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 3000, x = p.getX(i) / 3000;
    if (y > .15) c.copy(mid).lerp(top, Math.min(1, (y - .15) / .6)); else c.copy(low).lerp(mid, Math.max(0, (y + .1) / .25));
    if (night && x > .3 && y < .25 && y > -.05) c.lerp(new THREE.Color('#3B3446'), (x - .3) * .5);
    skyCol.set([c.r, c.g, c.b], i * 3);
  }
  skyGeo.attributes.color.needsUpdate = true;
}
const hemi = new THREE.HemisphereLight(0xC9D2DC, 0x3A2E22, .75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xFFF1D8, 1.05);
sun.position.set(420, 260, 180); sun.target.position.set(-120, 0, -80); scene.add(sun, sun.target);
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -380, right: 380, top: 220, bottom: -220, near: 10, far: 1400 });
sun.shadow.bias = -.0006;
const blastLight = new THREE.PointLight(0xFF9A4A, 0, 380, 1.8); scene.add(blastLight);
const chamberLight = new THREE.PointLight(0xFFE0A0, 0, 120, 2); scene.add(chamberLight);
function applyLighting() {
  const n = S.night;
  paintSky(n);
  scene.fog = new THREE.Fog(n ? 0x0A0D14 : 0xB9B5A6, n ? 260 : 700, n ? 1500 : 2600);
  hemi.intensity = n ? .22 : .6; hemi.color.set(n ? 0x5A6A88 : 0xC9D2DC);
  sun.intensity = n ? .16 : 1.05; sun.color.set(n ? 0x8C9CC8 : 0xFFF1D8);
  renderer.toneMappingExposure = n ? 1.3 : 1;
}

/* ================= Terrain mesh ================= */
let terrain, grid, faceFront, faceSides = [], baseH, curH, finalDisp, nx, nz, cell, terrainColors, baseColors;
const crackCol = new THREE.Color('#9A8868'), mudA = new THREE.Color('#403225'), mudB = new THREE.Color('#2A2119'), mudC = new THREE.Color('#5C4B38'), grass = new THREE.Color('#46502F'), clayCol = new THREE.Color('#6A7176'), water = new THREE.Color('#252B2C');
// fine detail texture: churned mud, clods and wheel-rutted grain, tiled every 6 m
const mudDetail = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d'), img = x.createImageData(512, 512), d = img.data;
  for (let j = 0; j < 512; j++) for (let i = 0; i < 512; i++) {
    const u = i / 512 * 8, v = j / 512 * 8;
    let n = .55 * vnoise(u * 2, v * 2) + .3 * vnoise(u * 6.3, v * 6.3) + .15 * vnoise(u * 17, v * 17);
    const clod = vnoise(u * 11 + 40, v * 11) > .78 ? .12 : 0;
    const val = Math.round(255 * Math.min(1, .66 + n * .42 + clod)), o = (j * 512 + i) * 4;
    d[o] = val; d[o + 1] = Math.round(val * .97); d[o + 2] = Math.round(val * .93); d[o + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; return t;
})();
function buildTerrain() {
  if (terrain) { scene.remove(terrain); terrain.geometry.dispose(); }
  cell = DETAIL[S.detail].cell;
  nx = Math.round((XMAX - XMIN) / cell); nz = Math.round((ZMAX - ZMIN) / cell);
  const cnt = (nx + 1) * (nz + 1);
  const pos = new Float32Array(cnt * 3), col = new Float32Array(cnt * 3), uvs = new Float32Array(cnt * 2);
  baseH = new Float32Array(cnt); curH = new Float32Array(cnt); finalDisp = new Float32Array(cnt);
  const c = new THREE.Color();
  for (let j = 0; j <= nz; j++) for (let i = 0; i <= nx; i++) {
    const k = j * (nx + 1) + i, x = XMIN + i * (XMAX - XMIN) / nx, z = ZMIN + j * (ZMAX - ZMIN) / nz;
    const h = surface0(x, z); baseH[k] = curH[k] = h;

    if (ev[o + 1] < 0) {
      // the model only has ground behind the cut face; debris landing in front of it is removed
      const front = ep[o + 2] > 0, gz = hAt(ep[o], front ? -.01 : ep[o + 2]);
      if (ep[o + 1] <= gz) { if (front || gz === -Infinity) ep[o + 1] = -9999; else ep[o + 1] = gz + .15; st[i] = 2; }
    }
  }
  ejecta.geometry.attributes.position.needsUpdate = true;
  // fire column (additive smoke sprites, capped so they stay orange rather than white)
  const fg = fire.geometry.attributes, fp = fg.position.array, ft = fg.tint.array, fa = fg.alpha.array, fs = fg.psize.array, fr = fg.rot.array, fv = sim.fv;
  for (let i = 0; i < sim.fLife.length; i++) {
    const age = t - sim.fStart[i], o = i * 3;
    if (age < 0 || age > sim.fLife[i]) { fp[o + 1] = -9999; fa[i] = 0; continue; }
    if (age - dt <= 0) { fp[o] = chamber.x + fv[o] * 1.5; fp[o + 1] = hAt(chamber.x, -.5) + 2; fp[o + 2] = Math.min(-.5, fv[o + 2] * 1.5); fr[i] = Math.random() * 6.28; }
    const fd = Math.exp(-1.1 * dt); fv[o] *= fd; fv[o + 1] = fv[o + 1] * fd - G * .2 * dt; fp[o] += fv[o] * dt; fp[o + 1] += fv[o + 1] * dt; fp[o + 2] += fv[o + 2] * dt;
    const k = age / sim.fLife[i];
    ft[o] = .95; ft[o + 1] = .42 * (1 - k) + .12; ft[o + 2] = .1 * (1 - k);
    fa[i] = .32 * (1 - k); fs[i] = 7 + age * 9; fr[i] += dt * .4;
  }
  fg.position.needsUpdate = fg.tint.needsUpdate = fg.alpha.needsUpdate = fg.psize.needsUpdate = fg.rot.needsUpdate = true;
  // dust: always simulated so switching it back on mid-blast shows it in the right place
  const dg = dust.geometry.attributes, dp = dg.position.array, dt2 = dg.tint.array, da = dg.alpha.array, ds = dg.psize.array, drt = dg.rot.array, dv = sim.dv;
  const aged = S.night ? [.2, .19, .18] : [.46, .42, .37], young0 = S.night ? [.08, .06, .045] : [.17, .13, .09];
  for (let i = 0; i < sim.dLife.length; i++) {
    const age = t - sim.dStart[i], o = i * 3;
    if (age < 0 || age > sim.dLife[i]) { dp[o + 1] = -9999; da[i] = 0; continue; }
    if (age - dt <= 0) {
      const a = Math.random() * 6.28, rr = (sim.dKind[i] ? M.R * (.7 + .4 * Math.random()) : M.R * .8 * Math.sqrt(Math.random()));
      dp[o] = chamber.x + Math.cos(a) * rr; dp[o + 2] = Math.min(-1, Math.sin(a) * rr); dp[o + 1] = hAt(dp[o], dp[o + 2]) + 2;
    }
    const k = sim.dK[i], damp = Math.exp(-k * dt), wind = 3.2 * Math.min(1, age / 6);
    dv[o] *= damp; dv[o + 2] *= damp; dv[o + 1] = dv[o + 1] * damp - G * .06 * dt;
    dp[o] += (dv[o] + wind) * dt; dp[o + 1] = Math.max(hAt(dp[o], Math.min(-.5, dp[o + 2])) + 1.5, dp[o + 1] + dv[o + 1] * dt); dp[o + 2] += dv[o + 2] * dt;
    const q = age / sim.dLife[i], fade = Math.min(1, age / .5) * Math.pow(1 - q, 1.3), y = Math.max(0, 1 - age / 12);
    // fresh spoil is near-black brown; it pales to grey-brown dust as it thins and spreads
    dt2[o] = aged[0] + (young0[0] - aged[0]) * y; dt2[o + 1] = aged[1] + (young0[1] - aged[1]) * y; dt2[o + 2] = aged[2] + (young0[2] - aged[2]) * y;
    if (S.night) { const glow = Math.exp(-age / 2.2) * Math.max(0, 1 - (dp[o + 1] - hAt(chamber.x, -.5)) / (M.plume * 1.1 + 1)); dt2[o] += .42 * glow; dt2[o + 1] += .16 * glow; dt2[o + 2] += .04 * glow; }   // lit from below by the flame at 03:10
    da[i] = (.5 + .25 * y) * fade; ds[i] = Math.min(110, sim.dSize[i] * (1 + age / 4)); drt[i] += sim.dSpin[i] * dt;
  }
  dg.position.needsUpdate = dg.tint.needsUpdate = dg.alpha.needsUpdate = dg.psize.needsUpdate = dg.rot.needsUpdate = true;
  // underground cavity glow in camouflet case
}

/* ================= Labels ================= */
const labelDefs = [];
function defineLabels() {
  const U = under.userData;
  const M = blastModel();
  labelDefs.length = 0;
  const L = (text, fn, cls = '') => labelDefs.push({ text, fn, cls });
  L('German front line', () => [XGF, surface0(XGF, -30) + 3, -30]);
  L('German support line', () => [XGS, surface0(XGS, -30) + 3, -30]);
  L("No man's land", () => [(XBF + XGF) / 2 - 10, surface0((XBF + XGF) / 2, -40) + 2.5, -40]);
  L('British front line', () => [XBF, surface0(XBF, -30) + 3, -30]);
  L('Site of Spanbroek windmill', () => [XC + 16, surface0(XC + 16, -70) + 3, -70]);
  L('British shaft: steel tubbing through the wet sand', () => [XS, U.ysh + 7, 0], 'u');
  L(`Gallery in the blue clay (~${GALLERY} m)`, () => [(XS + XC) / 2, U.yShaftBottom + 3.5, 0], 'u');
  L('Tamping: ~30 m of sandbags', () => [XC - 22, U.yc + 2.4, 0], 'u');
  L(`Charge: ${S.charge.toFixed(1)} t ammonal`, () => [XC + 2, U.yc - .6, 0], 'u hot');
  L('German counter-mine gallery (shallower)', () => [XGF - 8, U.gy(XGF - 8) + 2.2, 0], 'u');
  L('Sand and silt', () => [XC + 90, surface0(XC + 90, 0) - 3.5, 0], 'u');
  L('Water-bearing sand', () => [XC + 90, (Math.min(surface0(XC + 90, 0) - 2.6, 4.5) + clayTop(XC + 90)) / 2, 0], 'u');
  L('Blue clay (Ieper clay)', () => [XC + 90, clayTop(XC + 90) - 8, 0], 'u');
  L('Crater', () => sim && sim.t > sim.M.vent + 3 && !sim.M.camouflet ? [XC, surface0(XC, -sim.M.R * .45) - sim.M.D * .4, -sim.M.R * .45] : null, 'hot');
  const box = $('labels'); box.replaceChildren();
  labelDefs.forEach(l => { const e = document.createElement('div'); e.className = 'lab ' + l.cls; e.textContent = l.text; box.appendChild(e); l.el = e; });
}
const v3 = new THREE.Vector3();
function placeLabels() {
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  const panelLeft = w > 760 ? w - 320 : Infinity;
  const cand = [];
  for (const l of labelDefs) {
    const p = S.labels ? l.fn() : null;
    l.el.style.display = 'none';
    if (!p) continue;
    v3.set(p[0], p[1], p[2]); const dist = camera.position.distanceTo(v3);
    if (l.cls.includes('u') && (camera.position.z - p[2]) / dist < .35) continue;   // underground labels only when facing the cut face
    v3.project(camera);
    if (v3.z >= 1 || Math.abs(v3.x) > 1 || Math.abs(v3.y) > 1 || dist > 900) continue;
    const sx = (v3.x + 1) / 2 * w, sy = (1 - v3.y) / 2 * h;
    if (sx > panelLeft - 20) continue;                                // never under the control panel
    cand.push({ l, sx, sy, dist });
  }
  cand.sort((a, b) => (b.l.cls.includes('hot') - a.l.cls.includes('hot')) || a.dist - b.dist);
  const placed = [];
  for (const c of cand) {
    const wd = c.l.text.length * 6.6 + 14, box = [c.sx - wd / 2, c.sy - 24, c.sx + wd / 2, c.sy];
    if (placed.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;   // declutter: nearer label wins
    placed.push(box);
    c.l.el.style.display = ''; c.l.el.style.left = c.sx + 'px'; c.l.el.style.top = c.sy + 'px'; c.l.el.style.opacity = c.dist > 500 ? .6 : 1;
  }
}

/* ================= Camera ================= */
const CAMS = {
  // targets sit right of the subject so it stays clear of the control panel on wide screens
  section: () => ({ p: [XC - 55, 16, 150], t: [XC - 5, -10, 0] }),
  chamber: () => ({ p: [XC - 6, chamber.y + 4, 30], t: [XC + 8, chamber.y + 1, 0] }),
  shaft: () => ({ p: [XS + 22, surface0(XS, 0) + 4, 46], t: [XS + 18, surface0(XS, 0) - 14, 0] }),
  trench: () => ({ p: [XBF - 6, surface0(XBF - 6, -60) + 2.2, -60], t: [XC + 40, 55, -10] }),
  overview: () => ({ p: [XC - 300, 210, 360], t: [XC - 110, -12, -60] }),
  aerial: () => ({ p: [XC - 20, 520, 80], t: [XC + 20, 0, -90] })
};
let camTween = null;
function goCam(name, instant = false) {
  const c = CAMS[name]();
  if (instant) { camTween = null; camera.position.set(...c.p); controls.target.set(...c.t); controls.update(); return; } camTween = { from: camera.position.clone(), fromT: controls.target.clone(), to: new THREE.Vector3(...c.p), toT: new THREE.Vector3(...c.t), k: 0 };
}

/* ================= UI ================= */
function fmtW() { const lb = Math.round(S.charge * 2204.62 / 100) * 100; return `${S.charge.toFixed(1)} t · ${lb.toLocaleString()} lb`; }
function renderResults() {
  const M = blastModel(), P = PRESETS[S.preset];
  const rows = [
    ['Scaled depth', `${M.lam.toFixed(2)} m/kg^⅓`],
    M.camouflet ? ['Crater', 'none (camouflet)'] : ['Crater (model)', `${(2 * M.R).toFixed(0)} m wide · ${M.D.toFixed(0)} m deep`],
    ['Debris column', M.camouflet ? 'stays underground' : `~${Math.round(M.plume / 10) * 10} m high`],
    ['Shock reaches surface', `${(M.shockUp * 1000).toFixed(0)} ms`]
  ];
  let note = M.camouflet ? 'Too deep for the charge size: the blast crushes an underground cavity (a camouflet) instead of making a crater.'
    : M.lam < .45 ? 'Shallow charge: much of the energy vents into the air, making a wide, shallow crater.'
    : M.lam < 1.2 ? 'Close to the most efficient depth for making a crater, which is what the tunnellers aimed for.'
    : 'Deep charge: a narrower crater and a lower column, with more energy absorbed by the clay.';
  if (P && Math.abs(S.charge - P.t) < .05 && Math.abs(S.depth - P.d) < .05) note = P.note + ' ' + note;
  $('results').innerHTML = rows.map(([k, v]) => `<div class="row"><span>${k}</span><b>${v}</b></div>`).join('') +
    `<div class="note">${note}</div>
     <details><summary>How the numbers are worked out</summary>Crater size uses the scaled depth of burial, λ = depth ÷ (charge in kg)^⅓, a standard way to compare buried explosions. Crater radius ≈ 1.15 × W^⅓ × e^(−(λ−0.8)²/0.72); apparent depth ≈ 0.33 × radius; beyond λ ≈ 1.9 no crater forms. The stress wave climbs through wet clay at about 1.8 km/s; debris falls under gravity with air drag. It is an educational estimate, tuned so Spanbroekmolen comes out close to the real Pool of Peace.</details>`;
  $('sub').textContent = `${S.preset === 'custom' ? 'Custom mine' : PRESETS[S.preset].name}, Messines Ridge, Belgium · fired 03:10, 7 June 1917`;
}
function syncInputs() {
  $('preset').value = S.preset; $('charge').value = S.charge; $('depth').value = S.depth; $('speed').value = S.speedLog;
  $('chargeOut').textContent = fmtW(); $('depthOut').textContent = `${S.depth.toFixed(1)} m · ${Math.round(S.depth * 3.281)} ft`;
  const sp = Math.pow(10, S.speedLog); $('speedOut').textContent = sp >= 1 ? sp.toFixed(1) + '×' : sp >= .1 ? sp.toFixed(2) + '×' : sp.toFixed(3) + '×';
  document.querySelectorAll('#detail button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.detail)));
}
function mineChanged() { if (sim) resetSim(); buildUnderground(); defineLabels(); renderResults(); syncInputs(); }
$('preset').addEventListener('change', e => { S.preset = e.target.value; if (PRESETS[S.preset]) { S.charge = PRESETS[S.preset].t; S.depth = PRESETS[S.preset].d; } mineChanged(); });
$('charge').addEventListener('input', e => { if (sim) resetSim(); S.charge = +e.target.value; S.preset = 'custom'; syncInputs(); renderResults(); defineLabels(); });
$('charge').addEventListener('change', mineChanged);
$('depth').addEventListener('input', e => { if (sim) resetSim(); S.depth = +e.target.value; S.preset = 'custom'; syncInputs(); renderResults(); });
$('depth').addEventListener('change', mineChanged);
$('speed').addEventListener('input', e => { S.speedLog = +e.target.value; syncInputs(); });
document.querySelectorAll('#detail button').forEach(b => b.addEventListener('click', () => { if (S.detail === b.dataset.v) return; S.detail = b.dataset.v; rebuildAll(); }));
[['slowmo'], ['shake'], ['dust'], ['waves'], ['labelsOn', 'labels'], ['sound'], ['glow'], ['night']].forEach(([id, key]) => {
  key = key || id; const el = $(id); el.checked = S[key];
  el.addEventListener('change', () => { S[key] = el.checked; if (key === 'glow') glowLines.forEach(l => l.visible = S.glow); if (key === 'night') { applyLighting(); features.children.forEach(c => { if (c.userData.isWire) c.material.color.set(S.night ? 0x1C1B19 : 0x4A4640); }); } if (key === 'dust' && dust) dust.visible = S.dust && !!sim; if (key === 'night' && sim) { const c = ejecta.geometry.attributes.color; for (let i = 0; i < c.array.length; i++) c.array[i] *= S.night ? .38 : 1 / .38; c.needsUpdate = true; } });
});
$('fire').addEventListener('click', detonate);
$('reset').addEventListener('click', resetSim);
document.querySelectorAll('#cams button').forEach(b => b.addEventListener('click', () => goCam(b.dataset.cam)));
$('camH').addEventListener('input', e => { camTween = null; camera.position.y = +e.target.value; $('camHOut').textContent = `${Math.round(camera.position.y)} m`; });
$('toggle').addEventListener('click', () => { const p = $('panel'), closed = p.classList.toggle('closed'); $('toggle').textContent = closed ? 'Show' : 'Hide'; $('toggle').setAttribute('aria-expanded', String(!closed)); });
addEventListener('keydown', e => { if (/INPUT|SELECT|BUTTON|SUMMARY/.test(e.target.tagName)) return; if (e.key === ' ') { e.preventDefault(); sim ? resetSim() : detonate(); } });

function rebuildAll() {
  sim = null; $('loading').hidden = false; $('loading').textContent = 'Rebuilding at ' + S.detail + ' detail…';
  syncInputs();
  setTimeout(() => {
    renderer.shadowMap.enabled = DETAIL[S.detail].shadows; sun.castShadow = DETAIL[S.detail].shadows;
    buildTerrain(); buildFaces(); buildFeatures(); buildUnderground(); buildParticles(); defineLabels(); renderResults();
    scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
    clearEffects(); $('fire').disabled = false; $('tclock').textContent = 't = 0.000 s'; $('stage').textContent = 'Ready. Press Detonate.';
    $('loading').hidden = true;
  }, 30);
}
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

/* ================= Main loop ================= */
let last = performance.now(), shakeT = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt * 1.1); const e = ease(camTween.k);
    camera.position.lerpVectors(camTween.from, camTween.to, e); controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.k >= 1) camTween = null;
  }
  controls.update();
  if (sim) {
    stepSim(dt);
    if (sim.needNormals) { terrain.geometry.computeVertexNormals(); updateFace(faceFront); sim.needNormals = false; }
    const M = sim.M;
    $('tclock').textContent = `t = ${sim.t < 10 ? sim.t.toFixed(3) : sim.t.toFixed(1)} s`;
    $('stage').textContent = stageText(sim.t, M);
  }
  // camera shake: strongest when the dome bursts, fading over a few seconds
  let off = null;
  if (sim && S.shake) {
    const M = sim.M, k = sim.t < M.shockUp ? 0 : Math.exp(-(sim.t - M.shockUp) * 1.2) * Math.min(1.8, M.cube / 22) * (M.camouflet ? .4 : 1);
    if (k > .005) { shakeT += dt * 60; off = new THREE.Vector3((vnoise(shakeT, 1) - .5) * k, (vnoise(shakeT, 7) - .5) * k, (vnoise(shakeT, 13) - .5) * k); camera.position.add(off); }
  }
  if (document.activeElement !== $('camH')) { $('camH').value = Math.round(camera.position.y); $('camHOut').textContent = `${Math.round(camera.position.y)} m`; }
  syncSmokeUniforms();
  renderer.render(scene, camera);
  placeLabels();
  if (off) camera.position.sub(off);
  requestAnimationFrame(frame);
}

/* ================= Boot ================= */
resize(); applyLighting();
renderer.shadowMap.enabled = DETAIL[S.detail].shadows; sun.castShadow = DETAIL[S.detail].shadows;
buildTerrain(); buildFaces(); buildFeatures(); buildUnderground(); buildParticles();
defineLabels(); renderResults(); syncInputs();
const c0 = CAMS.section(); camera.position.set(...c0.p); controls.target.set(...c0.t);
$('loading').hidden = true;
requestAnimationFrame(frame);
window.__mine = { detonate, resetSim, goCam, S, get sim() { return sim; }, parts: () => ({ terrain, faceFront, faceSides, ejecta, fire, dust, fallback, features, under, faceRing }),
  seek(T) { if (sim && T < sim.t) resetSim(); if (!sim) detonate(); while (sim.t < T) advance(Math.min(.01, T - sim.t + 1e-6)); terrain.geometry.computeVertexNormals(); updateFace(faceFront); } };
})();
</script>
