<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internet Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --panel2:#faf9f6; --ink:#1b1d21; --ink2:#4a4f58; --ink3:#7a808a; --line:#e3e1db; --line2:#d3d0c8;
  --accent:#b4531f; --accent-ink:#ffffff; --focus:#2d6cdf;
  --record:#1f7a55; --record-bg:#e5f3ec; --owner:#2459b8; --owner-bg:#e6eefb; --crowd:#6b46b0; --crowd-bg:#efe9f9;
  --inferred:#9a6a00; --inferred-bg:#fbf1d9; --possible:#b3372f; --possible-bg:#fbe8e6;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 4px 16px rgba(20,20,20,.04);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111316; --panel:#181b1f; --panel2:#1d2126; --ink:#e8e9eb; --ink2:#b3b8c0; --ink3:#838a95; --line:#2a2f36; --line2:#363c44;
  --accent:#e0874f; --accent-ink:#1a1206; --focus:#6ea0ff;
  --record:#5fcf9d; --record-bg:#15302451; --owner:#7fa8f5; --owner-bg:#1a2a4a66; --crowd:#b597ef; --crowd-bg:#2b214466;
  --inferred:#e2b54e; --inferred-bg:#3a2d0c66; --possible:#f08a80; --possible-bg:#40191666; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#111316; --panel:#181b1f; --panel2:#1d2126; --ink:#e8e9eb; --ink2:#b3b8c0; --ink3:#838a95; --line:#2a2f36; --line2:#363c44;
  --accent:#e0874f; --accent-ink:#1a1206; --focus:#6ea0ff;
  --record:#5fcf9d; --record-bg:#15302451; --owner:#7fa8f5; --owner-bg:#1a2a4a66; --crowd:#b597ef; --crowd-bg:#2b214466;
  --inferred:#e2b54e; --inferred-bg:#3a2d0c66; --possible:#f08a80; --possible-bg:#40191666; --shadow:none;}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);overflow-x:hidden}
a{color:inherit} button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;text-decoration:none;white-space:nowrap}
.brand small{font:500 11px var(--mono);color:var(--ink3);letter-spacing:.8px;text-transform:uppercase}
.mark{width:28px;height:28px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.mark svg{width:17px;height:17px;stroke:var(--bg)}
form.search{flex:1;min-width:280px;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:5px 5px 5px 12px}
form.search:focus-within{border-color:var(--focus)}
form.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;padding:6px 0}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 9px;border-radius:5px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line2)}
.go{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:7px;padding:7px 14px;cursor:pointer}
.iconbtn{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--ink2)}
.guard{font-size:12.5px;color:var(--ink3);padding:0 0 10px}
.guard b{color:var(--ink2);font-weight:600}
.demo-banner{background:var(--inferred-bg);color:var(--inferred);border:1px solid color-mix(in srgb,var(--inferred) 40%,transparent);border-radius:8px;padding:8px 12px;font-size:13px;margin:14px 0 0;font-weight:500}
main{padding:22px 0 60px}
/* landing */
.hero{padding:48px 0 24px;max-width:760px}
.hero h1{font-size:34px;line-height:1.15;margin:0 0 12px;letter-spacing:-.4px}
.hero p{color:var(--ink2);font-size:16.5px;margin:0 0 22px}
.examples{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink)}
.chip:hover{border-color:var(--ink3)}
.chip .k{font:500 10.5px var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:34px 0 0}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13.5px;color:var(--ink2)}
.rule b{display:block;color:var(--ink);margin-bottom:4px;font-size:14px}
h3.small{font:600 11.5px var(--mono);letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);margin:30px 0 10px}
/* case header */
.casehead{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;margin-bottom:16px}
.caseid{font:500 12px var(--mono);color:var(--ink3);letter-spacing:.6px;text-transform:uppercase;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.casehead h1{font-size:30px;margin:4px 0 4px;letter-spacing:-.3px;line-height:1.2;overflow-wrap:anywhere}
.casehead .desc{color:var(--ink2);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);margin-bottom:8px}
.crumbs button{border:0;background:none;padding:0;color:var(--ink2);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0}
.stat{background:var(--panel);padding:12px 14px}
.stat .n{font:600 22px var(--mono)}
.stat .l{font-size:12px;color:var(--ink3)}
.coverage{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.cov{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 8px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.cov.ok .dot{background:var(--record)} .cov.empty .dot{background:var(--line2)} .cov.failed .dot{background:var(--possible)} .cov.skipped .dot{background:var(--inferred)}
.cov.running .dot{background:var(--owner);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.cov.running .dot{animation:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);align-items:center;margin:0 0 16px}
.legend label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.notes{display:grid;gap:8px;margin:0 0 16px}
.note{border-radius:8px;padding:10px 12px;font-size:13.5px;border:1px solid var(--line);background:var(--panel)}
.note.conflict{border-color:color-mix(in srgb,var(--possible) 45%,transparent);background:var(--possible-bg)}
.note.privacy,.note.caution{border-color:color-mix(in srgb,var(--inferred) 45%,transparent);background:var(--inferred-bg)}
.note b{margin-right:6px}
/* grid */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{grid-column:span 6;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.card.wide{grid-column:span 12} .card.third{grid-column:span 4} .card.twothird{grid-column:span 8}
.card h2{font-size:14px;margin:0;display:flex;align-items:center;gap:8px;font-weight:600}
.card h2 .cnt{font:500 11.5px var(--mono);color:var(--ink3)}
.card header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.card .body{padding:6px 16px 12px;min-width:0}
.empty{color:var(--ink3);font-size:13.5px;padding:10px 0}
.row{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:4px 14px;padding:9px 0 9px 12px;border-bottom:1px solid var(--line);position:relative}
.row:last-child{border-bottom:0}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--c,var(--ink3))}
.row.lv-possible::before{background:repeating-linear-gradient(to bottom,var(--possible) 0 4px,transparent 4px 7px)}
.row.lv-inferred::before{background:repeating-linear-gradient(to bottom,var(--inferred) 0 2px,transparent 2px 5px)}
.row .k{font-size:12.5px;color:var(--ink3);padding-top:1px;overflow-wrap:anywhere}
.row .v{min-width:0;overflow-wrap:anywhere}
.row.lv-possible .v{color:var(--ink2)}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--mono);border-radius:4px;padding:1px 6px;white-space:nowrap}
.lv-record{--c:var(--record)} .lv-owner{--c:var(--owner)} .lv-crowd{--c:var(--crowd)} .lv-inferred{--c:var(--inferred)} .lv-possible{--c:var(--possible)}
.pill.lv-record{background:var(--record-bg);color:var(--record)} .pill.lv-owner{background:var(--owner-bg);color:var(--owner)}
.pill.lv-crowd{background:var(--crowd-bg);color:var(--crowd)} .pill.lv-inferred{background:var(--inferred-bg);color:var(--inferred)}
.pill.lv-possible{background:var(--possible-bg);color:var(--possible);border:1px dashed color-mix(in srgb,var(--possible) 60%,transparent)}
.pill.corr{background:var(--panel2);color:var(--record);border:1px solid var(--line2)}
.pill.conf{background:var(--possible);color:#fff}
.fn{font:500 11px var(--mono);color:var(--ink2);text-decoration:none;border:1px solid var(--line2);border-radius:4px;padding:0 5px;cursor:pointer;background:var(--panel2)}
.fn:hover{border-color:var(--accent);color:var(--accent)}
.notetext{font-size:12.5px;color:var(--ink3);margin-top:3px}
.pivot{border:0;background:none;padding:0;cursor:pointer;color:var(--accent);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
a.ext{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
a.ext:hover{text-decoration-color:var(--accent)}
/* timeline */
.tl{list-style:none;margin:6px 0 0;padding:0 0 0 18px;position:relative}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding:6px 0 10px}
.tl li::before{content:"";position:absolute;left:-18px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--c)}
.tl li.lv-possible::before,.tl li.lv-inferred::before{border-style:dashed}
.tl .d{font:500 12.5px var(--mono);color:var(--ink2)}
/* entities */
.ents{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.ent{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:7px 10px;background:var(--panel2);min-width:0;max-width:100%}
.ent .r{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.5px;color:var(--ink3)}
.ent .n{font-weight:500;overflow-wrap:anywhere}
/* graph */
.graph{width:100%;height:auto;display:block;margin:6px 0}
.graph text{font:12px var(--sans);fill:var(--ink)}
.graph .lab{fill:var(--ink3);font:10.5px var(--mono)}
/* sources */
ol.src{margin:6px 0;padding:0;list-style:none;counter-reset:s}
ol.src li{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line);border-radius:6px;scroll-margin-top:120px}
ol.src li.hl{background:color-mix(in srgb,var(--accent) 14%,transparent)}
ol.src .i{font:600 12px var(--mono);color:var(--ink2)}
ol.src .p{font-size:12px;color:var(--ink3)}
.limits{font-size:13px;color:var(--ink2);margin:0;padding-left:18px}
.limits li{margin:3px 0}
.refused{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:640px;margin:40px 0}
.refused h2{margin:0 0 6px}
.skeleton{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--line) 0,var(--panel2) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.2s infinite;margin:12px 0}
@keyframes sh{to{background-position:-200% 0}}
.alts{font-size:13px;color:var(--ink2);margin:6px 0 0}
.alts button{margin:4px 6px 0 0}
@media (max-width:900px){.card,.card.third,.card.twothird{grid-column:span 12}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.casehead{grid-template-columns:1fr}.actions{justify-content:flex-start}}
@media (max-width:560px){.wrap{padding:0 16px}.hero h1{font-size:27px}.row{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.seg{order:3;width:100%}.seg button{flex:1;padding:4px 2px;font-size:12px}.graph{display:none}form.search{flex-wrap:wrap}}
@media print{header.top,.actions,.coverage,.legend label input{display:none}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="/" id="home"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5"/></svg></span>Internet Detective <small>public records</small></a>
      <form class="search" id="form" role="search">
        <input id="q" name="q" autocomplete="off" spellcheck="false" placeholder="Company, public figure, domain or @username" aria-label="Search">
        <div class="seg" id="seg" role="group" aria-label="Search as">
          <button type="button" data-t="auto" aria-pressed="true">Auto</button><button type="button" data-t="domain" aria-pressed="false">Domain</button><button type="button" data-t="company" aria-pressed="false">Company</button><button type="button" data-t="person" aria-pressed="false">Person</button><button type="button" data-t="username" aria-pressed="false">Username</button>
        </div>
        <button class="go" type="submit">Investigate</button>
      </form>
      <button class="iconbtn" id="theme" type="button" aria-label="Toggle dark mode">◐</button>
    </div>
    <div class="guard"><b>Public sources only.</b> No email, phone or home-address lookups. People are only researched if they're public figures with a Wikipedia article.</div>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const app = $("#app");
let TYPE = "auto", ES = null, CASE = null, TRAIL = [], FILTER = {record:1, owner:1, crowd:1, inferred:1, possible:1}, DEMO = false;
const LEVEL_ORDER = ["record","owner","crowd","inferred","possible"];
const LEVEL_HELP = {
  record: "Taken directly from an official registry or protocol record",
  owner: "Published by the site or account owner about themselves. Not independently checked",
  crowd: "From crowd-edited reference data (Wikidata/Wikipedia). Usually right, sometimes out of date",
  inferred: "Our interpretation of a record. Plausible but not stated by the source",
  possible: "Same name or username only. May be a different entity"
};

// ---------- tiny safe DOM helper ----------
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "href") { const u = safeHref(v); if (u) el.setAttribute("href", u); }
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
function safeHref(u){ try { const x = new URL(u, location.href); return ["http:","https:"].includes(x.protocol) ? x.href : ""; } catch { return ""; } }
function ext(url, text){ return h("a", {class:"ext", href:url, target:"_blank", rel:"noopener noreferrer nofollow"}, text || url); }

// ---------- store (per-browser conveniences only) ----------
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const savedTheme = store.get("id.theme", null); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark"; store.set("id.theme", document.documentElement.dataset.theme);
};

// ---------- search controls ----------
$("#seg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setType(b.dataset.t); });
function setType(t){ TYPE = t; for (const b of $("#seg").children) b.setAttribute("aria-pressed", String(b.dataset.t === t)); }
$("#form").addEventListener("submit", e => { e.preventDefault(); const q = $("#q").value.trim(); if (q) start(q, TYPE, true); });
$("#home").addEventListener("click", e => { e.preventDefault(); history.pushState({}, "", "/"); landing(); });
window.addEventListener("popstate", route);

function start(q, type, fresh){
  if (fresh) TRAIL = [];
  const url = new URL(location.href); url.search = new URLSearchParams({q, type}).toString();
  history.pushState({q, type}, "", url);
  run(q, type);
}
function pivot(q, type){
  if (CASE) TRAIL.push({q: CASE.query, type: CASE.kind === "name" ? "auto" : CASE.kind, name: CASE.subject.name});
  $("#q").value = q; setType(type || "auto"); start(q, type || "auto", false);
  window.scrollTo({top:0});
}
function route(){
  const p = new URLSearchParams(location.search);
  if (p.get("q")) { $("#q").value = p.get("q"); setType(p.get("type") || "auto"); run(p.get("q"), p.get("type") || "auto"); }
  else landing();
}

// ---------- landing ----------
function landing(){
  if (ES) ES.close();
  CASE = null; app.replaceChildren();
  const ex = DEMO
    ? [["domain","northwind-roasters.example"],["company","Northwind Roasters"],["username","@northwindhq"]]
    : [["domain","mozilla.org"],["company","Patagonia"],["person","Tim Berners-Lee"],["username","@torvalds"]];
  const recent = store.get("id.recent", []);
  app.append(
    DEMO ? h("div", {class:"demo-banner"}, "Demo mode: every result is fictional sample data from a made-up company. Restart without --demo for live research.") : "",
    h("section", {class:"hero"},
      h("h1", {}, "Open a case on any company, domain or username."),
      h("p", {}, "Internet Detective checks public registries, DNS, certificate logs, web archives and reference data, then builds a dashboard where every fact links to its source and shows how sure we are."),
      h("div", {class:"examples"}, ex.map(([t,q]) => h("button", {class:"chip", type:"button", onclick:()=>{ $("#q").value=q; setType(t==="username"?"username":"auto"); start(q, t==="username"?"username":"auto", true); }}, h("span",{class:"k"},t), q)))
    ),
    recent.length ? h("h3", {class:"small"}, "Recent cases") : "",
    recent.length ? h("div", {class:"examples"}, recent.map(r => h("button", {class:"chip", type:"button", onclick:()=>{ $("#q").value=r.q; setType(r.type); start(r.q, r.type, true); }}, h("span",{class:"k"},r.kind), r.name))) : "",
    h("div", {class:"rules"},
      h("div",{class:"rule"}, h("b",{},"Every claim is sourced"), "Each fact carries numbered footnotes to the page it came from, with the retrieval time."),
      h("div",{class:"rule"}, h("b",{},"Uncertainty is visible"), "Five confidence levels, from official record to unconfirmed match. Disagreements between sources are flagged."),
      h("div",{class:"rule"}, h("b",{},"Privacy by design"), "No personal contact details, no private individuals, no logins or paywalls. Same username is never treated as the same person."))
  );
}

// ---------- investigation stream ----------
function run(q, type){
  if (ES) ES.close();
  CASE = null;
  app.replaceChildren(h("div", {class:"casehead"}, h("div", {}, h("div",{class:"caseid"},"Opening case…"), h("h1",{}, q), h("div",{class:"skeleton", style:"width:40%"}))),
                      h("div",{class:"skeleton"}), h("div",{class:"skeleton", style:"width:70%"}));
  ES = new EventSource("/api/investigate?" + new URLSearchParams({q, type}));
  ES.addEventListener("update", e => { CASE = JSON.parse(e.data); render(false); });
  ES.addEventListener("done", e => { ES.close(); CASE = JSON.parse(e.data); render(true); remember(); });
  ES.addEventListener("refused", e => { ES.close(); refusal("Not something we look up", JSON.parse(e.data).message); });
  ES.addEventListener("invalid", e => { ES.close(); refusal("Check the search", JSON.parse(e.data).message); });
  ES.onerror = () => { if (ES.readyState !== 2) { ES.close(); if (!CASE) refusal("Couldn't reach the local server", "Is `python -m detective` still running?"); } };
}
function refusal(title, msg){
  app.replaceChildren(h("div",{class:"refused"}, h("h2",{},title), h("p",{},msg),
    h("p",{class:"notetext"}, "Internet Detective only researches organisations, domains, public figures and public usernames, using public records.")));
}
function remember(){
  if (!CASE || !CASE.claims.length) return;
  const r = store.get("id.recent", []).filter(x => x.q.toLowerCase() !== CASE.query.toLowerCase());
  r.unshift({q: CASE.query, type: CASE.kind === "name" ? "auto" : CASE.kind, kind: CASE.subject.type || CASE.kind, name: CASE.subject.name});
  store.set("id.recent", r.slice(0, 8));
}

// ---------- rendering ----------
function caseNo(c){ let x = 0; for (const ch of c.query + c.kind) x = (x * 31 + ch.charCodeAt(0)) >>> 0; return "ID-" + x.toString(36).toUpperCase().padStart(6,"0").slice(-6); }
function pill(level){ return h("span", {class:"pill lv-"+level, title: LEVEL_HELP[level]}, CASE.levels[level]); }
function fns(ids){ return ids.map(i => h("a", {class:"fn", href:"#src-"+i, title: srcTitle(i), onclick: e => { e.preventDefault(); flash(i); }}, "[" + i + "]")); }
function srcTitle(i){ const s = CASE.sources.find(s => s.id === i); return s ? s.title + " (" + s.publisher + ")" : ""; }
function flash(i){ const el = document.getElementById("src-"+i); if (!el) return; el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"}); el.classList.add("hl"); setTimeout(()=>el.classList.remove("hl"), 1600); }
const show = x => FILTER[x.level];

function claimRow(c){
  const val = c.link ? ext(c.link, c.value) : c.value;
  return h("div", {class:"row lv-"+c.level},
    h("div", {class:"k"}, c.label),
    h("div", {class:"v"}, val,
      h("div", {class:"meta"}, pill(c.level),
        c.corroborated ? h("span",{class:"pill corr", title:"Stated by independent publishers"}, "✓ " + c.sources.length + " sources agree") : "",
        c.conflict ? h("span",{class:"pill conf", title:"Another source says something different"}, "Conflict") : "",
        fns(c.sources),
        c.pivot ? h("button",{class:"pivot", type:"button", onclick:()=>pivot(c.pivot.q, c.pivot.type)}, "Investigate →") : ""),
      c.note ? h("div",{class:"notetext"}, c.note) : ""));
}
function card(title, items, opts={}){
  const body = h("div",{class:"body"});
  const list = items.filter(show);
  if (!list.length) body.append(h("div",{class:"empty"}, opts.running ? "Still checking…" : (items.length ? "Hidden by your confidence filter." : (opts.empty || "Nothing found in the sources checked."))));
  else body.append(...list.map(opts.row || claimRow));
  return h("section", {class:"card " + (opts.cls||"")}, h("header",{}, h("h2",{}, title, h("span",{class:"cnt"}, list.length ? list.length : ""))), body);
}

function graph(c){
  const nodes = [];
  const add = (label, rel, level) => { if (nodes.length < 14 && !nodes.some(n => n.label === label)) nodes.push({label, rel, level}); };
  c.claims.filter(x => x.section === "social" && show(x)).forEach(x => add(x.label + " @" + x.value.split(" ")[0], "profile", x.level));
  c.connections.filter(show).forEach(x => add(x.b, x.how, x.level));
  c.entities.filter(x => x.relation !== "subdomain" && show(x)).forEach(x => add(x.name, x.relation, x.level));
  if (!nodes.length) return null;
  const W = 1000, H = 420, cx = W/2, cy = H/2, rx = 250, ry = 150;
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("class","graph"); svg.setAttribute("role","img");
  svg.setAttribute("aria-label", "Connection map: " + nodes.map(n => n.rel + " " + n.label).join("; "));
  const mk = (t, a) => { const e = document.createElementNS("http://www.w3.org/2000/svg", t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const color = l => `var(--${l})`;
  nodes.forEach((n,i) => {
    const a = -Math.PI/2 + i * 2*Math.PI/nodes.length, x = cx + rx*Math.cos(a), y = cy + ry*Math.sin(a);
    Object.assign(n, {x, y});
    svg.append(mk("line", {x1:cx, y1:cy, x2:x, y2:y, stroke:color(n.level), "stroke-width":1.5, "stroke-dasharray": n.level==="possible" ? "5 4" : n.level==="inferred" ? "2 3" : "", opacity:.75}));
  });
  svg.append(mk("circle",{cx, cy, r:8, fill:"var(--ink)"}));
  const nm = c.subject.name || c.query;
  const ct = mk("text",{x:cx, y:cy-16, "text-anchor":"middle", style:"font-weight:600;font-size:14px;paint-order:stroke;stroke:var(--panel);stroke-width:5px"}); ct.textContent = nm.length > 34 ? nm.slice(0,33)+"…" : nm; svg.append(ct);
  nodes.forEach(n => {
    svg.append(mk("circle",{cx:n.x, cy:n.y, r:6, fill:"var(--panel)", stroke:color(n.level), "stroke-width":2.5}));
    const anchor = n.x < cx - 20 ? "end" : n.x > cx + 20 ? "start" : "middle", dx = anchor==="end" ? -10 : anchor==="start" ? 10 : 0;
    const t = mk("text",{x:n.x+dx, y:n.y-2, "text-anchor":anchor}); t.textContent = n.label.length > 28 ? n.label.slice(0,27)+"…" : n.label; svg.append(t);
    const l = mk("text",{x:n.x+dx, y:n.y+12, "text-anchor":anchor, class:"lab"}); l.textContent = n.rel; svg.append(l);
  });
  return svg;
}

function toMarkdown(c){
  const L = c.levels, out = [`# Case ${caseNo(c)}: ${c.subject.name}`, "", c.demo ? "> DEMO: fictional sample data.\n" : "",
    `Query: \`${c.query}\` (${c.kind}) · Generated ${new Date().toISOString()}`, "", "Confidence: " + Object.values(L).join(" > "), ""];
  const secs = [["identity","Identity"],["websites","Websites & infrastructure"],["social","Social presence"],["company","Company information"],["mentions","Public mentions"],["connections","Technology & services"]];
  for (const [k,t] of secs){ const xs = c.claims.filter(x => x.section===k); if (!xs.length) continue; out.push("## "+t);
    xs.forEach(x => out.push(`- **${x.label}:** ${x.value} (${L[x.level]}${x.corroborated?", corroborated":""}${x.conflict?", CONFLICT":""}) ${x.sources.map(s=>"["+s+"]").join("")}`)); out.push(""); }
  if (c.events.length){ out.push("## Timeline"); c.events.forEach(e => out.push(`- ${e.date}: ${e.text} (${L[e.level]}) ${e.sources.map(s=>"["+s+"]").join("")}`)); out.push(""); }
  if (c.entities.length){ out.push("## Related entities"); c.entities.forEach(e => out.push(`- ${e.name} (${e.relation}, ${L[e.level]}) ${e.sources.map(s=>"["+s+"]").join("")}`)); out.push(""); }
  if (c.connections.length){ out.push("## Connections"); c.connections.forEach(e => out.push(`- ${e.a} → ${e.how} → ${e.b} (${L[e.level]}) ${e.sources.map(s=>"["+s+"]").join("")}`)); out.push(""); }
  if (c.notes.length){ out.push("## Caveats"); c.notes.forEach(n => out.push("- " + n.text)); out.push(""); }
  out.push("## Sources"); c.sources.forEach(s => out.push(`${s.id}. ${s.title}: ${s.url} (${s.publisher}, retrieved ${s.retrieved})`));
  return out.join("\n");
}
function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

function render(done){
  const c = CASE; if (!c) return;
  const running = !done;
  const by = s => c.claims.filter(x => x.section === s);
  const nCorr = c.claims.filter(x => x.corroborated).length, nConf = c.claims.filter(x => x.conflict).length;
  const nWeak = c.claims.filter(x => x.level === "possible" || x.level === "inferred").length;
  const failed = c.coverage.filter(x => x.status === "failed");
  const subjLevel = c.subject.source ? c.subject.level : null;

  const head = h("div",{class:"casehead"},
    h("div",{},
      TRAIL.length ? h("nav",{class:"crumbs", "aria-label":"Investigation trail"}, TRAIL.map((t,i) => [h("button",{type:"button", onclick:()=>{ TRAIL = TRAIL.slice(0,i); $("#q").value=t.q; setType(t.type); start(t.q, t.type, false); }}, t.name), " → "]), h("span",{}, c.subject.name)) : "",
      h("div",{class:"caseid"}, "Case " + caseNo(c), h("span",{}, "·"), (c.subject.type || c.kind), h("span",{}, "·"), done ? (c.cached ? "cached result" : "complete") : "investigating…"),
      h("h1",{}, c.subject.name || c.query),
      c.subject.description ? h("p",{class:"desc"}, c.subject.description, " ", subjLevel ? pill(subjLevel) : "", " ", c.subject.source ? fns([c.subject.source]) : "") :
        h("p",{class:"desc"}, c.kind === "username" ? "Username search: public profiles only." : c.kind === "domain" ? "Domain investigation" : "No reference entry identified this name, so results below are name matches only."),
      c.alternatives.length ? h("div",{class:"alts"}, c.subject.source ? "Not the one you meant? " : "Did you mean: ", c.alternatives.map(a => h("button",{class:"chip", type:"button", title:a.description, onclick:()=>pivot(a.name, "auto")}, a.name, a.description ? h("span",{class:"k"}, a.description.slice(0,40)) : ""))) : ""),
    h("div",{class:"actions"},
      h("button",{class:"iconbtn", type:"button", disabled: running, onclick:()=>download(`case-${caseNo(c)}.md`, toMarkdown(c), "text/markdown")}, "Export report (.md)"),
      h("button",{class:"iconbtn", type:"button", disabled: running, onclick:()=>download(`case-${caseNo(c)}.json`, JSON.stringify(c, null, 2), "application/json")}, "Export data (.json)"),
      h("button",{class:"iconbtn", type:"button", onclick:()=>window.print()}, "Print")));

  const stats = h("div",{class:"stats"},
    [[c.sources.length,"sources cited"],[c.claims.length,"claims"],[nCorr,"corroborated by 2+ publishers"],[nConf,"in conflict"],[nWeak,"inferred or unconfirmed"]]
      .map(([n,l]) => h("div",{class:"stat"}, h("div",{class:"n"}, n), h("div",{class:"l"}, l))));

  const cov = h("div",{class:"coverage", "aria-label":"Sources checked"}, c.coverage.map(x =>
    h("span",{class:"cov "+x.status, title: x.detail || x.status}, h("span",{class:"dot"}), x.collector, h("span",{style:"color:var(--ink3)"}, x.status === "ok" ? "" : "· " + (x.status === "empty" ? "nothing found" : x.status)))));

  const legend = h("div",{class:"legend"}, h("span",{style:"color:var(--ink3)"}, "Show:"),
    LEVEL_ORDER.map(l => h("label",{title:LEVEL_HELP[l]}, h("input",{type:"checkbox", checked: FILTER[l] ? true : null, onchange:e => { FILTER[l] = e.target.checked ? 1 : 0; render(done); }}), pill(l))));

  const notes = h("div",{class:"notes"},
    c.demo ? h("div",{class:"note caution"}, h("b",{},"Demo data."), "This case uses fictional sample data from a made-up company.") : "",
    c.notes.map(n => h("div",{class:"note "+n.kind}, h("b",{}, n.kind === "conflict" ? "Conflict" : n.kind === "privacy" ? "Privacy stop" : "Caution"), n.text)),
    failed.length && done ? h("div",{class:"note caution"}, h("b",{},"Incomplete."), "Couldn't reach: " + failed.map(f => f.collector + " (" + f.detail + ")").join("; ") + ". Missing results from these sources are not evidence of absence.") : "");

  const tl = h("section",{class:"card third"}, h("header",{}, h("h2",{}, "Timeline", h("span",{class:"cnt"}, c.events.filter(show).length || ""))),
    h("div",{class:"body"}, c.events.filter(show).length ? h("ol",{class:"tl"}, c.events.filter(show).map(e =>
      h("li",{class:"lv-"+e.level}, h("div",{class:"d"}, e.date), h("div",{}, e.text), h("div",{class:"meta"}, pill(e.level), fns(e.sources))))) :
      h("div",{class:"empty"}, running ? "Still checking…" : "No dated events found.")));

  const ents = c.entities.filter(show);
  const rel = h("section",{class:"card twothird"}, h("header",{}, h("h2",{}, "Related entities", h("span",{class:"cnt"}, ents.length || ""))),
    h("div",{class:"body"}, ents.length ? h("div",{class:"ents"}, ents.map(e => h("div",{class:"ent lv-"+e.level, title: e.note || ""},
      h("div",{class:"r"}, e.relation), h("div",{class:"n"}, e.name), h("div",{class:"meta"}, pill(e.level), fns(e.sources),
        e.pivot ? h("button",{class:"pivot", type:"button", onclick:()=>pivot(e.pivot.q, e.pivot.type)}, "Investigate →") : ""))))
      : h("div",{class:"empty"}, running ? "Still checking…" : "No related organisations, people or subdomains found.")));

  const techNames = new Set(by("connections").map(x => x.value));
  const conns = c.connections.filter(show).filter(x => !techNames.has(x.b));
  const g = graph(c);
  const connCard = h("section",{class:"card wide"}, h("header",{}, h("h2",{}, "Interesting connections", h("span",{class:"cnt"}, (conns.length + by("connections").filter(show).length) || "")),
      h("span",{class:"notetext"}, "Solid = recorded or owner-linked · dashed = inferred or unconfirmed")),
    h("div",{class:"body"}, g || "",
      conns.map(x => h("div",{class:"row lv-"+x.level}, h("div",{class:"k"}, x.how), h("div",{class:"v"}, x.a + " → " + x.b,
        h("div",{class:"meta"}, pill(x.level), fns(x.sources)), x.note ? h("div",{class:"notetext"}, x.note) : ""))),
      by("connections").filter(show).map(claimRow),
      (!g && !conns.length && !by("connections").length) ? h("div",{class:"empty"}, running ? "Still checking…" : "No technology, services or cross-links found.") : ""));

  const sources = h("section",{class:"card wide"}, h("header",{}, h("h2",{}, "Sources", h("span",{class:"cnt"}, c.sources.length || "")), h("span",{class:"notetext"}, "Retrieved live. Click a footnote to jump here.")),
    h("div",{class:"body"}, c.sources.length ? h("ol",{class:"src"}, c.sources.map(s => h("li",{id:"src-"+s.id},
      h("span",{class:"i"}, "["+s.id+"]"), h("div",{}, ext(s.url, s.title), h("div",{class:"p"}, s.publisher + " · retrieved " + s.retrieved.replace("T"," ").replace("Z"," UTC"))))))
      : h("div",{class:"empty"}, "No sources yet.")));

  const limits = h("section",{class:"card wide"}, h("header",{}, h("h2",{}, "What this case doesn't cover")),
    h("div",{class:"body"}, h("ul",{class:"limits"},
      h("li",{}, "Only the sources listed above were checked. News sites, court records, social network contents and paid databases were not."),
      h("li",{}, "A registry or DNS record shows what was published, not who controls it today."),
      c.kind === "username" ? h("li",{}, "Matching usernames are not treated as the same owner unless the owner linked them.") : "",
      h("li",{}, "Crowd-sourced data (Wikidata, Wikipedia) can be outdated or wrong. Check important facts at the original source."))));

  app.replaceChildren(head, stats, cov, notes, legend,
    h("div",{class:"grid"},
      card("Identity", by("identity"), {running, cls:"", empty:"No identity details found."}),
      card("Company information", by("company"), {running, empty: c.subject.type === "person" ? "Not applicable to a person." : "No company registry or reference data found."}),
      card("Websites & infrastructure", by("websites"), {running, cls:"", empty:"No website or domain found to check."}),
      card("Social presence", by("social"), {running, empty:"No public profiles found."}),
      tl, rel,
      card("Public mentions", by("mentions"), {running, cls:"wide", empty:"No mentions found in the sources checked."}),
      connCard, sources, limits));
  document.title = (c.subject.name || c.query) + " · Internet Detective";
}

fetch("/api/health").then(r => r.json()).then(j => { DEMO = !!j.demo; route(); }).catch(route);
</script>
</body>
</html>
